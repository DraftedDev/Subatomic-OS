[package]
name = "kernel-x86_64"
version = "0.1.0"
edition = "2024"
description = "x86_64 target for Subatomic OS."

[dependencies]
x86_64 = "0.15.5"
raw-cpuid = "11.6.0"
talc = { version = "5.1.1", default-features = false }
acpi = "6.1.1"
x2apic = "0.5.0"
kernel-core = { path = "../kernel-core", features = ["pci"] }
limine = { workspace = true }
pc-keyboard = { workspace = true }
log = { workspace = true }

[lib]
name = "kernel_x86_64"
path = "src/lib.rs"
test = false
bench = false
